services:
  auth-service:
    build: .
    ports:
      - "8080:8000"
      - "50051:50051"
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      EUREKA_APP_NAME: auth-service
      EUREKA_INSTANCE_HOST: auth-service
      EUREKA_INSTANCE_PORT: "8000"
      EUREKA_HOME_PAGE_URL: /
      EUREKA_STATUS_PAGE_URL: /info/
      EUREKA_HEALTH_CHECK_URL: /health/
    depends_on:
      - postgres
      - redis
    networks:
      - chatapp

  postgres:
    image: postgres:17
    container_name: auth-postgres
    ports:
      - "5432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_service
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chatapp

  redis:
    image: redis:8-alpine
    container_name: auth-redis
    restart: unless-stopped
    networks:
      - chatapp

networks:
  chatapp:
    external: true

volumes:
  postgres_data:
