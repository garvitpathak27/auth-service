services:
  app:
    build: .
    ports:
      - "8000:8000"
      - "50051:50051"
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17
    container_name: auth-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: auth_service
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: garvitpathak2003

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: auth-redis

    restart: unless-stopped

volumes:
  postgres_data:
